name: TuckBar
# Source of truth for the Xcode project. Regenerate with `xcodegen generate`.
options:
  bundleIdPrefix: com.lelanddutcher
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: PKUE74YS72
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    DEAD_CODE_STRIPPING: YES
    COMBINE_HIDPI_IMAGES: YES
  configs:
    Debug:
      ENABLE_HARDENED_RUNTIME: NO
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      # Developer ID distribution requires the hardened runtime + notarization.
      ENABLE_HARDENED_RUNTIME: YES

targets:
  TuckBar:
    type: application
    platform: macOS
    sources:
      - path: Sources/TuckBar
      - path: Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: TuckBar
        PRODUCT_BUNDLE_IDENTIFIER: com.lelanddutcher.TuckBar
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: TuckBar.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  TuckBar:
    build:
      targets:
        TuckBar: all
    run:
      config: Debug
    archive:
      config: Release
